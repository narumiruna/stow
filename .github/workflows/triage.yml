name: Issue Triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  triage:
    # Configure this environment's PI_AUTH_JSON before enabling the workflow.
    environment: pi-oauth
    concurrency:
      group: pi-oauth-auth-json
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Classify issue
        id: triage
        uses: narumiruna/pi-actions/triage@1fb85820d1be62bd5caffb2b0011d85f4c17bc14
        with:
          auth-json: ${{ secrets.PI_AUTH_JSON }}
          auth-output: ${{ runner.temp }}/pi-triage-auth/auth.json
          provider: openai
          model: gpt-6.1-sol
          thinking: medium

      - name: Persist refreshed credentials
        if: always() && steps.triage.outcome != 'skipped'
        uses: narumiruna/pi-actions/persist-auth@24fb9e5926addb78fa677046d582abdc725a4a05
        with:
          auth-file: ${{ runner.temp }}/pi-triage-auth/auth.json
          auth-json: ${{ secrets.PI_AUTH_JSON }}
          token: ${{ secrets.PAT_TOKEN }}
