name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: Bump type
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "Run Bump Version from the ${DEFAULT_BRANCH} branch, not ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - name: Require release token
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [[ -z "$PAT_TOKEN" ]]; then
            echo "PAT_TOKEN must have repository contents write access so its tag push can trigger Release." >&2
            exit 1
          fi
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Bump project version
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump-type }}
        run: |
          previous_version="$(uvx --from 'bump-my-version==1.5.1' bump-my-version show current_version)"
          uvx --from 'bump-my-version==1.5.1' bump-my-version bump "$BUMP_TYPE" --no-commit --no-tag
          current_version="$(uvx --from 'bump-my-version==1.5.1' bump-my-version show current_version)"

          verified_version="$(Scripts/verify_version.sh)"
          if [[ "$verified_version" != "$current_version" ]]; then
            echo "Version verification returned ${verified_version}, expected ${current_version}." >&2
            exit 1
          fi

          echo "previous-version=$previous_version" >> "$GITHUB_OUTPUT"
          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"
      - name: Commit and tag the version
        env:
          CURRENT_VERSION: ${{ steps.bump.outputs.current-version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add .bumpversion.toml Scripts/generate_project.rb Stow.xcodeproj/project.pbxproj
          git commit -m "chore(release): bump version to ${CURRENT_VERSION}"
          git tag -a "v${CURRENT_VERSION}" -m "Release ${CURRENT_VERSION}"
      - name: Push version commit and tag
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_VERSION: ${{ steps.bump.outputs.current-version }}
        run: |
          gh auth setup-git
          git push --atomic origin "HEAD:${DEFAULT_BRANCH}" "refs/tags/v${CURRENT_VERSION}"
      - name: Report version
        run: |
          echo "Version was bumped from ${{ steps.bump.outputs.previous-version }} to ${{ steps.bump.outputs.current-version }}."
