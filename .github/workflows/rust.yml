name: Rust foundations

on:
  push:
    branches: [main]
    paths: ["Desktop/**", ".github/workflows/rust.yml"]
  pull_request:
    branches: [main]
    paths: ["Desktop/**", ".github/workflows/rust.yml"]

permissions:
  contents: read

jobs:
  non-interactive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run headless tests
        run: cargo test --workspace --locked
      - name: Build release artifacts
        run: cargo build --workspace --release --locked

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check security advisories
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependency licenses
        run: cargo deny --locked check licenses
