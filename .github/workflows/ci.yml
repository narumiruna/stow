name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - name: Build and test
        env:
          EXPECTED_XCODE_VERSION: "26.3"
          EXPECTED_SWIFT_VERSION_PREFIX: "6.2"
        run: Scripts/ci.sh
