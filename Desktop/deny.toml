[licenses]
# First-party crates use the repository license. Dependency choices must remain
# compatible with it; distribution notices and bundled native code need review.
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # Tauri cssparser/selectors/option-ext: preserve MPL source/notice obligations.
    "MPL-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
